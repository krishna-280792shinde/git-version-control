
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask and MongoDB Form</title>
</head>
<body>
    <h1>Contact Form</h1>
    <p>Submit your information to MongoDB Atlas.</p>

    {% if error %}
        <p style="color: red;" role="alert">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('submit') }}" method="POST">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"
               value="{{ name or '' }}" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
               value="{{ email or '' }}" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message"
                  required>{{ message or '' }}</textarea><br><br>

        <button type="submit">Submit Data</button>
    </form>

    <p><a href="{{ url_for('api') }}">View JSON API</a></p>
</body>
</html>
