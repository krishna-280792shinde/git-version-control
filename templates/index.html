
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask To-Do App</title>
</head>
<body>
    <h1>Flask To-Do App</h1>

    {% if error %}
        <p style="color: red;" role="alert">{{ error }}</p>
    {% endif %}

    <h2>Add a To-Do Item</h2>
    <form action="/submittodoitem" method="POST">
        <label for="itemId">Item ID:</label><br>
        <input type="text" id="itemId" name="itemId" required>
        <br><br>

        <label for="itemUuid">Item UUID:</label><br>
        <input type="text" id="itemUuid" name="itemUuid" required>
        <br><br>

        <label for="itemHash">Item Hash:</label><br>
        <input type="text" id="itemHash" name="itemHash" required>
        <br><br>

        <label for="itemName">Item Name:</label><br>
        <input type="text" id="itemName" name="itemName" required>
        <br><br>

        <label for="itemDescription">Item Description:</label><br>
        <textarea id="itemDescription" name="itemDescription" required></textarea>
        <br><br>

        <button type="submit">Submit To-Do Item</button>
    </form>

    <hr>

    <h2>Contact Form</h2>
    <p>Submit your contact information to MongoDB Atlas.</p>

    <form action="{{ url_for('submit') }}" method="POST">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"
               value="{{ name or '' }}" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
               value="{{ email or '' }}" required>
        <br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message"
                  required>{{ message or '' }}</textarea>
        <br><br>

        <button type="submit">Submit Contact Data</button>
    </form>

    <p><a href="{{ url_for('api') }}">View JSON API</a></p>
</body>
</html>
